services:
  postgres:
    image: postgres:16
    container_name: secure-dms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: secure_dms
      POSTGRES_USER: secure_dms
      POSTGRES_PASSWORD: secure_dms_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: